services:
  falkordb:
    image: falkordb/falkordb:latest
    ports: ["6379:6379", "3000:3000"]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
    depends_on:
      falkordb:
        condition: service_healthy
